<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Registro de Jornada IA</title>
<meta name="description" content="Registro electrónico de jornada laboral con verificación facial, GPS y OTP">

<!-- PWA: instalación y pantalla de inicio -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a78d6">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- iOS: agregar a pantalla de inicio como app independiente -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jornada IA">
<!-- Android/Chrome antiguos -->
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  color-scheme:light;
  --bg:#f9f9f7; --surface:#fcfcfb; --surface2:#f3f3f0; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6d67;
  --line:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-ink:#fff; --accent-soft:#e4eefb; --track:#cde2fb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300;
  --shadow:0 1px 2px rgba(11,11,11,.04),0 4px 14px rgba(11,11,11,.05);
  --r:14px; --gutter:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface2:#222221; --ink:#fff; --ink2:#c3c2b7; --muted:#a3a19a;
    --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-soft:#16283f; --track:#184f95;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --good-ink:#0ca30c; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#222221; --ink:#fff; --ink2:#c3c2b7; --muted:#a3a19a;
  --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:#16283f; --track:#184f95;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --good-ink:#0ca30c; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
p{margin:0}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .small{font-size:13px} .xs{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Shell */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1240px;margin:0 auto;padding:10px var(--gutter);display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center}
.page{max-width:1240px;margin:0 auto;padding:18px var(--gutter) 90px}
.page.worker{max-width:520px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 var(--gutter);max-width:1240px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:11px 12px;color:var(--ink2);font-weight:550;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:7px;align-items:center}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav .in{display:flex;width:100%;max-width:520px}
.bottomnav button{flex:1;border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer}
.bottomnav button[aria-current="page"]{color:var(--accent);font-weight:650}

/* Componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent}
.btn.big{width:100%;min-height:64px;font-size:18px;border-radius:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--ink2);font-weight:550}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--axis);border-radius:9px;padding:9px 11px;min-height:40px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.chip.ok i{background:var(--good)} .chip.warn i{background:var(--warn)} .chip.serious i{background:var(--serious)} .chip.crit i{background:var(--crit)} .chip.info i{background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:13px;color:var(--ink2)} .kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.hero .v{font-size:48px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--ink2);font-weight:600;background:var(--surface2);position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface2)}
tr.sel td{background:var(--accent-soft)}
.meter{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.meter>b{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.warn>b{background:var(--warn)} .meter.crit>b{background:var(--crit)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.alert{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);align-items:flex-start}
.alert .g{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;margin-top:1px}
.alert.critical .g{background:var(--crit)} .alert.warning .g{background:var(--serious);color:#0b0b0b} .alert.info .g{background:var(--accent)}
.alert .t{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.notice{border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
.notice.crit{border-color:color-mix(in srgb,var(--crit) 60%,var(--line))}
.notice.ok{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.list{display:flex;flex-direction:column}
.list>.it{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.list>.it:last-child{border-bottom:0}
.clock{font-size:44px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.pill-status{display:flex;align-items:center;gap:8px;font-weight:600}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(12,163,12,.5);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
.daybox{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.daybox:last-child{border-bottom:0}
.daybox .d{font-weight:650;font-size:13px}
.flags{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.flag{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:flex-start}
.flag b{flex:none;width:14px;text-align:center}
.usercard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.usercard:hover{border-color:var(--accent)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.login{max-width:560px;margin:0 auto}

/* Modal, toast, tooltip */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px var(--gutter) calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheet.wide{max-width:760px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
.stepper{display:flex;gap:6px;margin:6px 0 14px}
.stepper span{flex:1;height:5px;border-radius:9px;background:var(--line)}
.stepper span.on{background:var(--accent)} .stepper span.done{background:var(--good)}
.videobox{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;color:#fff}
.videobox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.videobox .frame{position:absolute;inset:14% 24%;border:2px dashed rgba(255,255,255,.75);border-radius:50%;pointer-events:none}
.videobox .msg{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:rgba(0,0,0,.6);font-size:13px;text-align:center}
.otp{letter-spacing:.5em;font-size:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:650}
.demo-auth{border:1px dashed var(--axis);border-radius:11px;padding:10px 12px;font-size:13px;background:var(--surface2)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12.5px;max-width:260px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart rect.hit{fill:transparent}
.chart rect.hit:hover{fill:var(--ring)}
.qr svg{width:180px;height:180px;background:#fff;padding:8px;border-radius:12px;display:block}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.kpi.hero .v{font-size:40px}.hide-sm{display:none!important}}
@media print{.topbar,.tabs,.bottomnav,.btn{display:none!important}body{background:#fff}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="tip" class="tip hide" role="tooltip"></div>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
   NÚCLEO — funciones puras (sin DOM): hash, TOTP, cadena, calendario,
   motor de cálculo LFT, nómina diaria y datos de demostración.
   ===================================================================== */
'use strict';

/* ---------- Utilidades de bytes / hash ---------- */
const _enc = new TextEncoder();
const toBytes = s => (typeof s === 'string' ? _enc.encode(s) : s);
const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
const rotr = (x, n) => (x >>> n) | (x << (32 - n));
const rotl = (x, n) => (x << n) | (x >>> (32 - n));

// Constantes SHA-256 derivadas de las raíces de los primeros primos
const _primes = (() => { const p = []; for (let n = 2; p.length < 64; n++) if (p.every(q => n % q)) p.push(n); return p; })();
const _frac = x => Math.floor((x - Math.floor(x)) * 4294967296) >>> 0;
const K256 = _primes.map(p => _frac(Math.cbrt(p)));
const H256 = _primes.slice(0, 8).map(p => _frac(Math.sqrt(p)));

function sha256(msg) {
  const bytes = toBytes(msg), l = bytes.length;
  const padLen = ((l + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(padLen); buf.set(bytes); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(padLen - 8, Math.floor((l * 8) / 4294967296)); dv.setUint32(padLen - 4, (l * 8) >>> 0);
  const H = H256.slice(), w = new Uint32Array(64);
  for (let o = 0; o < padLen; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = (w[i - 16] + (rotr(a, 7) ^ rotr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rotr(b, 17) ^ rotr(b, 19) ^ (b >>> 10))) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K256[i] + w[i]) >>> 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}

function sha1(msg) {
  const bytes = toBytes(msg), l = bytes.length;
  const padLen = ((l + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(padLen); buf.set(bytes); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(padLen - 8, Math.floor((l * 8) / 4294967296)); dv.setUint32(padLen - 4, (l * 8) >>> 0);
  let h0 = 0x67452301, h1 = 0xefcdab89, h2 = 0x98badcfe, h3 = 0x10325476, h4 = 0xc3d2e1f0;
  const w = new Uint32Array(80);
  for (let o = 0; o < padLen; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 80; i++) w[i] = rotl(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1) >>> 0;
    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let i = 0; i < 80; i++) {
      let f, k;
      if (i < 20) { f = (b & c) | (~b & d); k = 0x5a827999; }
      else if (i < 40) { f = b ^ c ^ d; k = 0x6ed9eba1; }
      else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8f1bbcdc; }
      else { f = b ^ c ^ d; k = 0xca62c1d6; }
      const t = (rotl(a, 5) + f + e + k + w[i]) >>> 0;
      e = d; d = c; c = rotl(b, 30) >>> 0; b = a; a = t;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  const out = new Uint8Array(20), o = new DataView(out.buffer);
  [h0, h1, h2, h3, h4].forEach((x, i) => o.setUint32(i * 4, x));
  return out;
}

function hmacSha1(key, msg) {
  key = toBytes(key); msg = toBytes(msg);
  if (key.length > 64) key = sha1(key);
  const ip = new Uint8Array(64 + msg.length), op = new Uint8Array(84);
  for (let i = 0; i < 64; i++) { const k = key[i] || 0; ip[i] = k ^ 0x36; op[i] = k ^ 0x5c; }
  ip.set(msg, 64); op.set(sha1(ip), 64);
  return sha1(op);
}

/* ---------- Base32 + TOTP (RFC 4226 / 6238) ---------- */
const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function base32Decode(s) {
  s = s.replace(/[\s=-]/g, '').toUpperCase();
  let bits = 0, val = 0; const out = [];
  for (const ch of s) {
    const i = B32.indexOf(ch); if (i < 0) throw new Error('Base32 inválido');
    val = (val << 5) | i; bits += 5;
    if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; }
  }
  return Uint8Array.from(out);
}
function base32Encode(bytes) {
  let bits = 0, val = 0, out = '';
  for (const b of bytes) { val = (val << 8) | b; bits += 8; while (bits >= 5) { out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; } }
  if (bits > 0) out += B32[(val << (5 - bits)) & 31];
  return out;
}
function hotp(key, counter, digits = 6) {
  const msg = new Uint8Array(8), dv = new DataView(msg.buffer);
  dv.setUint32(0, Math.floor(counter / 4294967296)); dv.setUint32(4, counter >>> 0);
  const h = hmacSha1(key, msg), off = h[19] & 15;
  const bin = ((h[off] & 0x7f) << 24) | (h[off + 1] << 16) | (h[off + 2] << 8) | h[off + 3];
  return String(bin % Math.pow(10, digits)).padStart(digits, '0');
}
const totpStep = (t = Date.now(), step = 30) => Math.floor(t / 1000 / step);
const totp = (secret, t = Date.now(), digits = 6) => hotp(base32Decode(secret), totpStep(t), digits);
function totpCheck(secret, code, lastStep = -1, t = Date.now(), win = 1) {
  // Devuelve el paso válido (para evitar reutilización) o null

/* ---------- Cadena de bloques ligera (hash-chain) ---------- */
const GENESIS = '0'.repeat(64);
function canon(o) {
  if (o === null || typeof o !== 'object') return JSON.stringify(o === undefined ? null : o);
  if (Array.isArray(o)) return '[' + o.map(canon).join(',') + ']';
  return '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + canon(o[k])).join(',') + '}';
}
const blockHash = b => sha256([b.i, b.ts, b.prev, b.type, canon(b.data)].join('|'));
function appendBlock(chain, type, data, ts) {
  const last = chain.length ? chain[chain.length - 1] : null;
  const b = { i: chain.length, ts: ts == null ? Date.now() : ts, prev: last ? last.hash : GENESIS, type, data };
  if (last && b.ts < last.ts) b.ts = last.ts; // la cadena nunca retrocede en el tiempo
  b.hash = blockHash(b);
  chain.push(b);
  return b;
}
function verifyChain(chain) {
  for (let i = 0; i < chain.length; i++) {
    const b = chain[i];
    if (b.i !== i) return { ok: false, at: i, why: 'Índice fuera de secuencia' };
    if (b.prev !== (i ? chain[i - 1].hash : GENESIS)) return { ok: false, at: i, why: 'El enlace con el bloque anterior está roto' };
    if (blockHash(b) !== b.hash) return { ok: false, at: i, why: 'El contenido fue alterado (el hash no coincide)' };
    if (i && b.ts < chain[i - 1].ts) return { ok: false, at: i, why: 'La marca de tiempo retrocede' };
  }
  return { ok: true, n: chain.length, head: chain.length ? chain[chain.length - 1].hash : GENESIS };
}

/* ---------- Fechas ---------- */
const DAY = 86400000;
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const weekStart = d => addDays(d, -((d.getDay() + 6) % 7));
const diffDays = (a, b) => Math.round((pd(ymd(b)) - pd(ymd(a))) / DAY);
const atTime = (dateStr, hhmm) => { const [h, m] = hhmm.split(':').map(Number); const d = pd(dateStr); d.setHours(h, m, 0, 0); return d.getTime(); };

const fmtClock = ts => { const d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const DIAS_LARGO = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

/* ---------- Marco legal (LFT México, reforma publicada 1-may-2026) ---------- */
const TURNOS = { diurna: { horas: 8, label: 'Diurna (8 h)' }, mixta: { horas: 7.5, label: 'Mixta (7.5 h)' }, nocturna: { horas: 7, label: 'Nocturna (7 h)' } };
const CALENDARIO_LEGAL = { 2026: [48, 9], 2027: [46, 9], 2028: [44, 10], 2029: [42, 11], 2030: [40, 12] };
function legalParams(year, cfg) {
  const [maxSem, dobles] = CALENDARIO_LEGAL[Math.min(2030, Math.max(2026, year))];
  return {
    year, maxSemanal: maxSem,
    topeDobles: cfg && cfg.topeDoblesSem != null ? cfg.topeDoblesSem : dobles,
    maxDiaExtra: 4, maxDiasExtra: 4, maxDiaTotal: 12, topeAbsoluto: 16

}
function holidaysMX(year) {
  const nth = (m, n) => { const d = new Date(year, m, 1); return new Date(year, m, 1 + ((1 - d.getDay() + 7) % 7) + 7 * (n - 1)); };
  const l = [[new Date(year, 0, 1), 'Año Nuevo'], [nth(1, 1), 'Día de la Constitución'], [nth(2, 3), 'Natalicio de Benito Juárez'],
    [new Date(year, 4, 1), 'Día del Trabajo'], [new Date(year, 8, 16), 'Independencia de México'], [nth(10, 3), 'Revolución Mexicana'],
    [new Date(year, 11, 25), 'Navidad']];
  if ((year - 2024) % 6 === 0 && year >= 2024) l.push([new Date(year, 9, 1), 'Transmisión del Poder Ejecutivo Federal']);
  return Object.fromEntries(l.map(([d, n]) => [ymd(d), n]));
}
const _holCache = {};
const holidayName = s => { const y = +s.slice(0, 4); return (_holCache[y] = _holCache[y] || holidaysMX(y))[s] || null; };
const vacDays = k => k < 1 ? 0 : k <= 5 ? 10 + 2 * k : 22 + 2 * Math.floor((k - 6) / 5); // LFT art. 76 (Vacaciones Dignas)
function yearsOfService(ingreso, on) {
  const a = pd(ingreso), b = on; let y = b.getFullYear() - a.getFullYear();
  if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) y--;
  return Math.max(0, y);
}
const vacEntitled = (w, on) => { let t = 0; for (let k = 1; k <= yearsOfService(w.ingreso, on); k++) t += vacDays(k); return t; };

/* ---------- Punches → sesiones → días ---------- */
function buildAllPunches(db) {
  const adj = {}, out = {};
  db.chain.forEach(b => { if (b.type === 'ADJUST' && b.data.op === 'CORREGIR') adj[b.data.ref] = b.data; });
  db.chain.forEach(b => {
    const d = b.data; if (!d || !d.w) return;
    if (b.type === 'PUNCH') {
      const a = adj[b.i];
      (out[d.w] = out[d.w] || []).push({ ts: a ? a.newTs : b.ts, origTs: b.ts, k: d.k, bi: b.i, geo: d.geo, mod: d.mod, face: d.face, corrected: !!a, motivo: a && a.motivo });
    } else if (b.type === 'ADJUST' && d.op === 'MANUAL') {
      (out[d.w] = out[d.w] || []).push({ ts: d.newTs, k: d.k, bi: b.i, manual: true, motivo: d.motivo });
    }
  });
  Object.values(out).forEach(a => a.sort((x, y) => x.ts - y.ts));
  return out;
}
function buildSessions(punches) {
  const ses = []; let cur = null;
  for (const p of punches || []) {
    if (p.k === 'IN') {
      if (cur) { cur.flags.push('Entrada duplicada ignorada'); continue; }
      cur = { start: p.ts, end: null, inP: p, outP: null, flags: [] }; ses.push(cur);
    } else if (!cur) ses.push({ start: null, end: p.ts, inP: null, outP: p, flags: ['Salida sin entrada'] });
    else { cur.end = p.ts; cur.outP = p; cur = null; }
  }
  return ses;
}
const weekDigest = sessions => sha256(canon(sessions.map(s => [s.start, s.end])));

/* ---------- Solicitudes ---------- */
const REQ_TIPOS = {
  vacaciones: 'Vacaciones', permiso_goce: 'Permiso con goce de sueldo', permiso_sin: 'Permiso sin goce de sueldo',
  incap_general: 'Incapacidad — enfermedad general', incap_trabajo: 'Incapacidad — riesgo de trabajo', incap_maternidad: 'Incapacidad — maternidad'
};
const isIncap = t => t.startsWith('incap_');
function requestFor(db, wid, dateStr) {
  return db.requests.find(r => r.w === wid && r.estatus === 'aprobada' && r.desde <= dateStr && dateStr <= r.hasta) || null;
}
function requestDays(r, w) { // días laborables cubiertos (vacaciones) o naturales (incapacidad)
  let n = 0;
  for (let d = pd(r.desde); ymd(d) <= r.hasta; d = addDays(d, 1)) {
    if (isIncap(r.tipo) || w.dias.includes(d.getDay())) n++;
  }
  return n;
}
function vacBalance(db, w, on) {
  const used = db.requests.filter(r => r.w === w.id && r.tipo === 'vacaciones' && r.estatus === 'aprobada').reduce((a, r) => a + requestDays(r, w), 0);
  const pending = db.requests.filter(r => r.w === w.id && r.tipo === 'vacaciones' && r.estatus === 'pendiente').reduce((a, r) => a + requestDays(r, w), 0);
  const ent = vacEntitled(w, on);
  return { entitled: ent, used, pending, available: ent - used - pending, years: yearsOfService(w.ingreso, on) };
}

/* ---------- Motor de cálculo ---------- */
function sessionInfo(s, nowTs) {
  if (s.start == null) return { presence: 0, state: 'orphan' };
  if (s.end != null) return { presence: Math.round((s.end - s.start) / 60000), state: 'closed' };
  if (nowTs - s.start < 16 * 3600e3) return { presence: Math.round((nowTs - s.start) / 60000), state: 'live' };
  return { presence: 0, state: 'missing' };
}

function calcWorker(db, w, from, to, now, allPunches) {
  const cfg = db.cfg, nowTs = now, today = ymd(new Date(now));
  const ses = buildSessions((allPunches || buildAllPunches(db))[w.id]);
  const byDate = {};
  ses.forEach(s => { const k = ymd(new Date(s.start != null ? s.start : s.end)); (byDate[k] = byDate[k] || []).push(s); });
  const jm = TURNOS[w.turno].horas * 60, sd = w.salarioDiario, hourly = sd / TURNOS[w.turno].horas;
  const first = weekStart(pd(from)), last = addDays(weekStart(pd(to)), 6);
  const days = [], alerts = [];
  for (let d = first; d <= last; d = addDays(d, 1)) {
    const ds = ymd(d), wd = d.getDay(), sess = byDate[ds] || [];
    const o = { date: ds, wd, w: w.id, sessions: sess, presence: 0, worked: 0, ordMin: 0, extraMin: 0, dobMin: 0, triMin: 0, live: false, flags: [], pay: {} };
    o.inRange = ds >= from && ds <= to;
    o.feriado = holidayName(ds);
    o.programado = w.dias.includes(wd);
    o.legalRest = wd === w.diaDescanso;
    if (ds < w.ingreso) { o.status = 'PREINGRESO'; days.push(o); continue; }
    if (ds > today) { o.status = 'FUTURO'; days.push(o); continue; }
    let pres = 0, missing = false;
    sess.forEach(s => {
      const inf = sessionInfo(s, nowTs);
      if (inf.state === 'live') o.live = true;
      if (inf.state === 'missing') { missing = true; }
      pres += inf.presence;
      s.flags.forEach(f => o.flags.push({ sev: 'info', msg: f }));
    });
    o.presence = pres;
    if (missing) o.flags.push({ sev: 'critical', msg: 'Salida no registrada: la jornada quedó abierta', code: 'missing' });
    const comida = w.comidaMin != null ? w.comidaMin : cfg.comidaMin;
    o.worked = (sess.length === 1 && pres >= 360) ? Math.max(0, pres - comida) : pres;
    const req = requestFor(db, w.id, ds);
    o.req = req;
    if (o.worked > 0 || o.live || sess.some(s => s.start != null && s.end != null)) {
      o.status = 'TRABAJADO';
      if (o.programado) { o.ordMin = Math.min(o.worked, jm); o.extraMin = Math.max(0, o.worked - jm); }
      else if (o.legalRest) { o.ordMin = Math.min(o.worked, jm); o.extraMin = Math.max(0, o.worked - jm); }
      else { o.ordMin = 0; o.extraMin = o.worked; } // día de descanso convencional: todo es tiempo extraordinario
    } else if (req) o.status = isIncap(req.tipo) ? 'INCAPACIDAD' : req.tipo === 'vacaciones' ? 'VACACIONES' : req.tipo === 'permiso_goce' ? 'PERMISO_GOCE' : 'PERMISO_SIN';
    else if (o.feriado) o.status = 'FESTIVO';
    else if (o.programado) o.status = missing ? 'ABIERTA' : ds === today ? 'PENDIENTE' : 'FALTA';
    else o.status = 'DESCANSO';
    if (o.status === 'FALTA' && ds < today) o.flags.push({ sev: 'warning', msg: 'Falta sin justificar', code: 'falta' });
    days.push(o);
  }
  // Clasificación semanal de horas extra
  for (let i = 0; i < days.length; i += 7) {
    const wk = days.slice(i, i + 7), p = legalParams(pd(wk[0].date).getFullYear(), cfg);
    let dobAcc = 0, extraDays = 0, totExtra = 0, ordTot = 0;
    wk.forEach(o => {
      ordTot += o.ordMin;
      if (o.presence > p.maxDiaTotal * 60) o.flags.push({ sev: 'critical', msg: `Jornada total de ${fmtHM(o.presence)} h: excede el máximo de ${p.maxDiaTotal} h al día`, code: 'max12' });
      const e = o.extraMin; if (e <= 0) return;
      extraDays++; totExtra += e;
      const elegible = extraDays <= p.maxDiasExtra ? Math.min(e, p.maxDiaExtra * 60) : 0;
      const dob = Math.min(elegible, Math.max(0, p.topeDobles * 60 - dobAcc));
      o.dobMin = dob; o.triMin = e - dob; dobAcc += dob;
      if (e > p.maxDiaExtra * 60) o.flags.push({ sev: 'warning', msg: `${fmtHM(e)} h extra en el día: excede ${p.maxDiaExtra} h (el excedente se paga triple)`, code: 'extra4' });
      else if (extraDays > p.maxDiasExtra) o.flags.push({ sev: 'warning', msg: `Extras en más de ${p.maxDiasExtra} días de la semana (se pagan triple)`, code: 'extraDias' });
      else if (o.triMin > 0) o.flags.push({ sev: 'warning', msg: `Se superó el tope semanal de ${p.topeDobles} h dobles: el excedente se paga triple`, code: 'topeSem' });
    });
    if (totExtra > p.topeAbsoluto * 60) wk[wk.length - 1].flags.push({ sev: 'critical', msg: `Semana con ${fmtHM(totExtra)} h extra: rebasa el máximo absoluto de ${p.topeAbsoluto} h`, code: 'abs16' });
    if (ordTot > p.maxSemanal * 60) wk[wk.length - 1].flags.push({ sev: 'warning', msg: `Jornada ordinaria semanal de ${fmtHM(ordTot)} h supera el máximo legal de ${p.maxSemanal} h para ${p.year}`, code: 'maxSem' });
    wk.weekInfo = { ordTot, totExtra, dobAcc, p };
    wk.forEach(o => { o.week = wk.weekInfo; });
  }
  // Geocerca, retardos y cálculo de pago
  days.forEach(o => {
    if (!o.inRange || o.status === 'FUTURO' || o.status === 'PREINGRESO') return;
    o.sessions.forEach(s => {
      if (s.inP && s.inP.geo && s.inP.geo.inside === false && w.modalidad === 'presencial') o.flags.push({ sev: 'warning', msg: 'Marcación de entrada fuera de la geocerca (' + Math.round(s.inP.geo.d) + ' m)', code: 'geo' });
      if (s.inP && s.inP.geo && s.inP.geo.sim) o.flags.push({ sev: 'info', msg: 'Ubicación simulada (demo)', code: 'simgeo' });
      [s.inP, s.outP].forEach(p => {
        if (p && p.face && p.face.mode === 'simulado') o.flags.push({ sev: 'info', msg: 'Verificación facial simulada (no biométrica)', code: 'sim' });
        if (p && (p.manual || p.corrected)) o.flags.push({ sev: 'info', msg: (p.manual ? 'Marcación agregada por RH: ' : 'Marcación corregida por RH: ') + (p.motivo || ''), code: 'ajuste' });
      });
      if (s.inP && o.programado && w.ini && s.inP.k === 'IN') {
        const late = Math.round((s.start - atTime(o.date, w.ini)) / 60000);
        if (late > cfg.tolRetardo && late < 240) o.flags.push({ sev: 'info', msg: `Retardo de ${late} min`, code: 'retardo' });
      }
    });
    // Pago diario
    const p = o.pay; p.sueldo = 0; p.dob = 0; p.tri = 0; p.dom = 0; p.desc = 0; p.fest = 0; p.vac = 0; p.subsidio = 0;
    switch (o.status) {
      case 'TRABAJADO': case 'DESCANSO': case 'FESTIVO': case 'VACACIONES': case 'PERMISO_GOCE': case 'PENDIENTE': case 'ABIERTA': p.sueldo = sd; break; // PENDIENTE (hoy, aún sin marcar) y ABIERTA (salida por corregir) se pagan de forma provisional
      default: break; // FALTA, PERMISO_SIN, INCAPACIDAD → la empresa no paga el día
    }
    if (o.status === 'VACACIONES') p.vac = sd * 0.25;
    if (o.status === 'INCAPACIDAD') {
      const ramo = o.req.tipo, idx = diffDays(pd(o.req.desde), pd(o.date)) + 1;
      p.subsidio = ramo === 'incap_general' ? (idx >= 4 ? sd * 0.6 : 0) : sd; // IMSS: enf. general 60% desde el 4.º día; riesgo/maternidad 100%
    }
    if (o.status === 'TRABAJADO') {
      p.dob = (o.dobMin / 60) * hourly * 2; p.tri = (o.triMin / 60) * hourly * 3;
      if (o.legalRest) p.desc = sd * 2; // art. 73: pago doble adicional por descanso semanal laborado
      else if (o.wd === 0 && o.programado) p.dom = sd * 0.25; // art. 71: prima dominical
      if (o.feriado) p.fest = sd * 2; // art. 75: descanso obligatorio laborado
    }
    p.total = p.sueldo + p.dob + p.tri + p.dom + p.desc + p.fest + p.vac;
    p.neto = p.total * (1 - (cfg.deduccionPct || 0) / 100);
    o.flags.forEach(f => alerts.push({ ...f, w: w.id, date: o.date }));
  });
  const rng = days.filter(o => o.inRange);
  const tot = { ordMin: 0, dobMin: 0, triMin: 0, worked: 0, sueldo: 0, dob: 0, tri: 0, primas: 0, vac: 0, total: 0, neto: 0, subsidio: 0, faltas: 0, dias: 0 };
  rng.forEach(o => {
    if (o.status === 'FUTURO' || o.status === 'PREINGRESO') return;
    tot.ordMin += o.ordMin; tot.dobMin += o.dobMin; tot.triMin += o.triMin; tot.worked += o.worked;
    tot.sueldo += o.pay.sueldo; tot.dob += o.pay.dob; tot.tri += o.pay.tri; tot.primas += o.pay.dom + o.pay.desc + o.pay.fest;
    tot.vac += o.pay.vac; tot.total += o.pay.total; tot.neto += o.pay.neto; tot.subsidio += o.pay.subsidio;
    if (o.status === 'FALTA') tot.faltas++; tot.dias++;
  });
  const openNow = ses.find(s => s.end == null && s.start != null && sessionInfo(s, nowTs).state === 'live') || null;
  return { w, days: rng, allDays: days, tot, alerts, openNow, sessions: ses };
}

function calcAll(db, from, to, now) {
  const pun = buildAllPunches(db);
  const res = db.workers.filter(w => w.role === 'worker').map(w => calcWorker(db, w, from, to, now, pun));
  const alerts = res.flatMap(r => r.alerts).sort((a, b) => (b.date > a.date ? 1 : -1));
  // Objeciones de la persona trabajadora aún sin atender (sin ajuste ni nueva conformidad posterior)
  db.chain.forEach(b => {
    if (b.type !== 'OBJECION') return;
    const later = db.chain.slice(b.i + 1).some(x => (x.type === 'ADJUST' || x.type === 'CONFORMIDAD') && x.data.w === b.data.w);
    if (!later) alerts.push({ sev: 'warning', code: 'objecion', w: b.data.w, date: ymd(new Date(b.ts)), msg: `Objeción de la semana del ${b.data.semana}: “${b.data.nota}”` });
  });
  return { res, alerts, pun };
}

/* ---------- Datos de demostración ---------- */
const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

function seedDemo(now) {
  const rnd = mulberry32(20260921);
  const cfg = defaultConfig();
  const W = (id, nombre, puesto, turno, ini, fin, dias, sal, ingreso, modalidad, comidaMin, dd = 0) =>

  const workers = [

let _faceP = null;
function ensureFaceApi() {
  if (window.faceapi && faceapi.nets.faceRecognitionNet.isLoaded && faceapi.nets.tinyFaceDetector.isLoaded && faceapi.nets.faceLandmark68Net.isLoaded) return Promise.resolve();
  if (!_faceP) _faceP = (async () => {
    if (!window.faceapi) await loadScript(CDN_FACE);
    // TensorFlow.js: elegir backend explícitamente (WebGL; si no existe, CPU) y esperar a que esté listo
    const tf = faceapi.tf; let backend = '';
    for (const b of ['webgl', 'cpu']) { try { if (await tf.setBackend(b)) { await tf.ready(); backend = b; break; } } catch (e) { } }
    if (!backend) await tf.ready();
    window.__tfBackend = tf.getBackend();
    await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(CDN_MODELS), faceapi.nets.faceLandmark68Net.loadFromUri(CDN_MODELS), faceapi.nets.faceRecognitionNet.loadFromUri(CDN_MODELS)]);
  })().catch(e => { _faceP = null; throw e; });

}
const dist2 = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); };

// Bucle de detección: prueba de vida por parpadeo (EAR) + comparación de descriptor
async function faceLoop(video, ref, umbral, say, signal) {
  const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
  const t0 = Date.now(); let phase = 0, samples = [], best = 9, blinked = false, everBlinked = false;
  while (!signal.aborted) {
    if (Date.now() - t0 > 45000) throw new Error(!samples.length ? 'No se detectó un rostro a tiempo. Revisa la iluminación y la cámara.' : !everBlinked ? 'No detecté el parpadeo (prueba de vida). Mira a la cámara y parpadea una vez con naturalidad.' : 'El rostro no coincide con el enrolado. Intenta de nuevo con mejor luz o usa el modo simulado.');
    const det = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor();
    if (window.__faceTestHook) window.__faceTestHook(det); // gancho para pruebas automatizadas
    if (!det) { say('No veo un rostro. Centra tu cara en el óvalo.'); await sleep(100); continue; }
    const pts = det.landmarks.positions, ear = (eyeEAR(pts.slice(36, 42)) + eyeEAR(pts.slice(42, 48))) / 2;
    if (ear > 0.26) {
      if (phase === 2) { blinked = true; everBlinked = true; }
      if (phase === 0) phase = 1;
      if (phase >= 1 && samples.length < 12) { const d = Array.from(det.descriptor); samples.push(d); if (ref) best = Math.min(best, dist2(d, ref)); }
    } else if (ear < 0.22 && phase === 1) phase = 2;
    if (!blinked) say(phase === 0 ? 'Mantén los ojos abiertos…' : phase === 1 ? 'Ahora parpadea una vez' : 'Abre los ojos');
    else if (ref) {
      if (best < umbral && samples.length >= 2) return { score: +best.toFixed(3) };
      say('Comparando rostro…'); phase = 1; blinked = false; // sigue intentando hasta el tiempo límite
    } else { say('Registrando rostro…'); if (samples.length >= 3) return { descriptor: avgDesc(samples).map(v => +v.toFixed(4)), score: 0 }; blinked = false; phase = 1; }
    await sleep(60);
  }

}

  switch (p.preset) {
    case 'sem': return [ymd(ws), ymd(addDays(ws, 6))];

/* ---------- Gráfica apilada (horas por día) ---------- */
function stackChart(days) {
  const series = [['Ordinarias', 'var(--s1)', 'ord'], ['Extra dobles', 'var(--s2)', 'dob'], ['Extra triples', 'var(--s3)', 'tri']];
  const legend = `<div class="legend">${series.map(s => `<span><i style="background:${s[1]}"></i>${s[0]}</span>`).join('')}</div>`;
  if (S.chartTable) return legend + `<div class="scroll" style="margin-top:10px;max-height:300px"><table><thead><tr><th>Día</th><th class="r">Ordinarias</th><th class="r">Extra dobles</th><th class="r">Extra triples</th></tr></thead><tbody>${days.map(d => `<tr><td>${fmtDate(d.date)}</td><td class="r">${fmtHM(d.ord * 60)}</td><td class="r">${fmtHM(d.dob * 60)}</td><td class="r">${fmtHM(d.tri * 60)}</td></tr>`).join('')}</tbody></table></div>`;
  const W = 760, H = 250, ml = 38, mr = 8, mt = 10, mb = 28, iw = W - ml - mr, ih = H - mt - mb, n = days.length, band = iw / n, bw = Math.min(24, band * 0.7);
  const mx = Math.max(1, ...days.map(d => d.ord + d.dob + d.tri)), step = [1, 2, 5, 10, 20, 25, 50, 100].find(s => mx / s <= 5) || 100, top = Math.ceil(mx / step) * step;
  const y = v => mt + ih - (v / top) * ih;
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="${v === 0 ? 'base' : 'grid'}" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const every = n <= 16 ? 1 : n <= 24 ? 2 : 4;
  days.forEach((d, i) => {
    const x = ml + band * i + (band - bw) / 2, tot = d.ord + d.dob + d.tri;
    let yb = y(0); const vals = series.map(s => d[s[2]]); const lastIdx = vals.map((v, k) => v > 0 ? k : -1).reduce((a, b) => Math.max(a, b), -1);
    vals.forEach((v, k) => {
      if (v <= 0) return; const h = (v / top) * ih, seg = Math.max(1, h - (yb < y(0) ? 2 : 0)), yy = yb - seg;
      if (k === lastIdx && seg > 4) { const r = 4; g += `<path fill="${series[k][1]}" d="M${x},${yy + r}a${r},${r} 0 0 1 ${r},-${r}h${bw - 2 * r}a${r},${r} 0 0 1 ${r},${r}V${yb}H${x}z"/>`; }
      else g += `<rect fill="${series[k][1]}" x="${x}" y="${yy}" width="${bw}" height="${seg}"/>`;
      yb = yy;
    });
    const tip = `<b>${fmtDate(d.date)}</b><br>Ordinarias: ${fmtHM(d.ord * 60)} h<br>Extra dobles: ${fmtHM(d.dob * 60)} h<br>Extra triples: ${fmtHM(d.tri * 60)} h<br>Total: ${fmtHM(tot * 60)} h`;
    g += `<rect class="hit" x="${ml + band * i}" y="${mt}" width="${band}" height="${ih}" data-tip="${esc(tip)}"/>`;
    if (i % every === 0) g += `<text x="${ml + band * i + band / 2}" y="${H - 8}" text-anchor="middle">${+d.date.slice(8)}</text>`;
  });
  return legend + `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas por día: ordinarias, extra dobles y extra triples" style="margin-top:8px">${g}</svg>`;
}

/* ---------- RH: Nómina ---------- */
function conceptRows(A, from, to) {
  const rows = [];
  A.res.forEach(r => {
    const w = r.w, t = r.tot, D = r.days.filter(o => o.status !== 'FUTURO' && o.status !== 'PREINGRESO');
    const push = (clave, concepto, cantidad, importe, info) => { if (cantidad || importe) rows.push({ empleado: w.id, nombre: w.nombre, periodo_inicio: from, periodo_fin: to, clave, concepto, cantidad: +cantidad.toFixed(2), importe: +importe.toFixed(2), tipo: info ? 'informativo' : clave[0] === 'D' ? 'deduccion' : 'percepcion' }); };
    push('P001', 'Sueldo', D.filter(o => o.pay.sueldo > 0).length, t.sueldo);
    push('P002', 'Horas extra dobles', t.dobMin / 60, t.dob);
    push('P003', 'Horas extra triples', t.triMin / 60, t.tri);
    push('P004', 'Prima dominical', D.filter(o => o.pay.dom > 0).length, D.reduce((a, o) => a + o.pay.dom, 0));
    push('P005', 'Descanso semanal laborado', D.filter(o => o.pay.desc > 0).length, D.reduce((a, o) => a + o.pay.desc, 0));
    push('P006', 'Descanso obligatorio laborado', D.filter(o => o.pay.fest > 0).length, D.reduce((a, o) => a + o.pay.fest, 0));
    push('P007', 'Prima vacacional', D.filter(o => o.pay.vac > 0).length, t.vac);
    const ded = t.total - t.neto; if (ded > 0) push('D001', 'Deducciones estimadas', 1, ded);
    push('I001', 'Faltas injustificadas (días)', t.faltas, 0, true);
    push('I002', 'Incapacidad (días)', D.filter(o => o.status === 'INCAPACIDAD').length, t.subsidio, true);
    push('I003', 'Vacaciones (días)', D.filter(o => o.status === 'VACACIONES').length, 0, true);
  });
  return rows;
}

    empresa: DB.cfg.empresa, periodo: { inicio: from, fin: to }, generado: new Date().toISOString(), moneda: 'MXN', deduccion_estimada_pct: DB.cfg.deduccionPct, cadena: { integra: ver.ok, bloques: ver.n, raiz: ver.head },
    empleados: A.res.map(r => ({
      id: r.w.id, nombre: r.w.nombre, salario_diario: r.w.salarioDiario,
      totales: { horas_ordinarias: +(r.tot.ordMin / 60).toFixed(2), horas_extra_dobles: +(r.tot.dobMin / 60).toFixed(2), horas_extra_triples: +(r.tot.triMin / 60).toFixed(2), percepciones_brutas: +r.tot.total.toFixed(2), neto_estimado: +r.tot.neto.toFixed(2) },
      dias: r.days.filter(o => o.status !== 'FUTURO' && o.status !== 'PREINGRESO').map(o => ({ fecha: o.date, estado: o.status, min_ordinarios: o.ordMin, min_dobles: o.dobMin, min_triples: o.triMin, sueldo: +o.pay.sueldo.toFixed(2), horas_extra: +(o.pay.dob + o.pay.tri).toFixed(2), primas: +(o.pay.dom + o.pay.desc + o.pay.fest + o.pay.vac).toFixed(2), total: +o.pay.total.toFixed(2) })),
      conceptos: conceptRows({ res: [r] }, from, to).map(c => ({ clave: c.clave, concepto: c.concepto, cantidad: c.cantidad, importe: c.importe, tipo: c.tipo }))
    }))
  };
}
function toCSV(rows) {

  return '﻿' + [cols.join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\r\n');

  'chart-toggle': el => { S.chartTable = el.dataset.t === '1'; render(); },

  tamper: () => {
    const c = JSON.parse(JSON.stringify(DB.chain)); if (!c.length) return toast('No hay bloques'); const cands = c.filter(b => b.type === 'PUNCH'), tgt = cands.length ? cands[Math.floor(cands.length / 2)] : c[0];
    tgt.ts += 7 * 60000; const r = verifyChain(c); S.integ = { ...r, simulated: true }; render();
  },

  'adj-new': el => openAdjust(el.dataset.w ? { w: el.dataset.w, date: el.dataset.date, k: el.dataset.k || 'OUT', time: el.dataset.k === 'OUT' ? (wById(el.dataset.w).fin || '18:00') : (wById(el.dataset.w).ini || '09:00') } : null),
  'export-csv': () => { const [f, t] = perRange(), A = calcAll(DB, f, t, Date.now()), rows = conceptRows(A, f, t); if (!rows.length) return toast('No hay conceptos en el periodo'); sealPayroll(payrollPayload(A, f, t), f, t, A.res.reduce((a, r) => a + r.tot.total, 0)); downloadFile(`nomina_${f}_${t}.csv`, toCSV(rows), 'text/csv'); toast('CSV exportado y cierre sellado en la cadena'); render(); },
  'export-json': () => { const [f, t] = perRange(), A = calcAll(DB, f, t, Date.now()), pl = payrollPayload(A, f, t); sealPayroll(pl, f, t, A.res.reduce((a, r) => a + r.tot.total, 0)); downloadFile(`nomina_${f}_${t}.json`, JSON.stringify(pl, null, 1), 'application/json'); toast('JSON exportado y cierre sellado en la cadena'); render(); },

  'cfg-geo-here': async () => { try { const c = await getPosition(); $('#c3').value = c.latitude.toFixed(5); $('#c4').value = c.longitude.toFixed(5); toast('Ubicación cargada. Guarda la configuración.'); } catch (e) { toast(e.message); } },

function decideReq(id, ok) {
  const r = DB.requests.find(x => x.id === id), w = wById(r.w);
  openModal(`<form data-form="decide" data-id="${id}" data-ok="${ok ? 1 : 0}" class="col"><div class="row between"><h2>${ok ? 'Aprobar' : 'Rechazar'} solicitud</h2><button type="button" class="btn sm ghost" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>
    <div class="small"><b>${esc(w.nombre)}</b> · ${esc(REQ_TIPOS[r.tipo])} · ${reqDatesLabel(r)}</div>
    ${ok && isIncap(r.tipo) ? `<div class="field"><label for="df">Folio de incapacidad IMSS (obligatorio)</label><input id="df" name="folio" required value="${esc(r.folio || '')}"></div>` : ''}
    <div class="field"><label for="dn">Nota ${ok ? '(opcional)' : '(motivo del rechazo)'}</label><textarea id="dn" name="nota" ${ok ? '' : 'required'}></textarea></div>
    <button class="btn ${ok ? 'primary' : 'danger'}" type="submit">${ok ? 'Aprobar' : 'Rechazar'}</button></form>`);
}

/* ---------- Envío de formularios ---------- */
const FORM = {
  req: (f, fd) => {
    const u = curUser(), d = Object.fromEntries(fd), r = { id: nextId('r'), w: u.id, tipo: d.tipo, desde: d.desde, hasta: d.hasta, motivo: (d.motivo || '').trim(), folio: (d.folio || '').trim(), estatus: 'pendiente', creada: Date.now() };
    if (r.hasta < r.desde) return toast('La fecha final no puede ser anterior a la inicial');
    if (DB.requests.some(x => x.w === u.id && x.estatus !== 'rechazada' && x.desde <= r.hasta && x.hasta >= r.desde)) return toast('Ya tienes una solicitud en esas fechas');
    if (r.tipo === 'vacaciones') {
      if (r.desde < todayStr()) return toast('Las vacaciones deben solicitarse con fecha de hoy en adelante');
      const days = requestDays(r, u), bal = vacBalance(DB, u, new Date()); if (!days) return toast('El rango no incluye días laborables'); if (days > bal.available) return toast(`Solicitas ${days} día(s) pero solo tienes ${Math.max(0, bal.available)} disponible(s)`);
    }
    DB.requests.push(r); appendBlock(DB.chain, 'SOLICITUD', { w: u.id, id: r.id, tipo: r.tipo, desde: r.desde, hasta: r.hasta }, Date.now()); save(); toast('Solicitud enviada a RH'); render();
  },
  adj: (f, fd) => {
    const d = Object.fromEntries(fd), newTs = atTime(d.date, d.time); if (newTs > Date.now()) return toast('No se puede registrar una hora futura');
    const data = { w: d.w, op: d.op, newTs, motivo: d.motivo.trim(), by: curUser().id };
    if (d.op === 'MANUAL') data.k = d.k; else { data.ref = +d.ref; const orig = DB.chain[data.ref]; if (!orig || orig.type !== 'PUNCH') return toast('Selecciona una marcación válida'); data.origTs = orig.ts; }
    const b = appendBlock(DB.chain, 'ADJUST', data, Date.now()); save(); closeModal(); toast('Ajuste sellado en el bloque #' + b.i); render();
  },
  emp: (f, fd) => {
    const d = Object.fromEntries(fd), id = f.dataset.id, dias = fd.getAll('dias').map(Number);
    if (!dias.length) return toast('Selecciona al menos un día laboral');
    if (dias.includes(+d.diaDescanso)) return toast('El día de descanso semanal no puede ser laboral');
    const vals = { nombre: d.nombre.trim(), puesto: d.puesto.trim(), turno: d.turno, ini: d.ini, fin: d.fin, dias, diaDescanso: +d.diaDescanso, salarioDiario: +d.salarioDiario, comidaMin: +d.comidaMin, ingreso: d.ingreso, modalidad: d.modalidad };
    if (id) Object.assign(wById(id), vals); else DB.workers.push({ id: nextId('w'), role: 'worker', secret: genSecret(), lastStep: -1, face: null, acuerdo: null, ...vals });
    save(); closeModal(); toast(id ? 'Cambios guardados' : 'Persona dada de alta. Comparte su clave OTP desde el botón “OTP”.'); render();
  },
  cfg: (f, fd) => {
    const d = Object.fromEntries(fd), c = DB.cfg;
    Object.assign(c, { empresa: d.empresa.trim(), geoPolitica: d.geoPolitica, comidaMin: +d.comidaMin, tolRetardo: +d.tolRetardo, deduccionPct: +d.deduccionPct, umbralRostro: +d.umbralRostro, topeDoblesSem: d.topeDoblesSem === '' ? null : +d.topeDoblesSem, apiUrl: d.apiUrl.trim(), apiToken: d.apiToken.trim() });
    c.geo = { nombre: d.gnombre.trim() || 'Centro de trabajo', lat: +d.glat, lon: +d.glon, radio: +d.gradio }; save(); toast('Configuración guardada'); render();
  },
  decide: (f, fd) => {
    const id = f.dataset.id, ok = f.dataset.ok === '1', r = DB.requests.find(x => x.id === id), w = wById(r.w), d = Object.fromEntries(fd);
    if (ok && r.tipo === 'vacaciones') { const days = requestDays(r, w), bal = vacBalance(DB, w, new Date()); if (days > bal.entitled - bal.used) return toast('Excede el saldo de vacaciones disponible'); }
    if (ok && isIncap(r.tipo)) r.folio = (d.folio || '').trim();
    r.estatus = ok ? 'aprobada' : 'rechazada'; r.nota = (d.nota || '').trim(); r.resuelta = Date.now(); r.por = curUser().id;
    appendBlock(DB.chain, 'RESOLUCION', { w: r.w, id: r.id, estatus: r.estatus, by: r.por }, Date.now()); save(); closeModal(); toast(ok ? 'Solicitud aprobada' : 'Solicitud rechazada'); render();
  }
};

/* ---------- Cambios de controles ---------- */
const CHG = {
  mod: el => { F.mod = el.value; F.err = ''; showCapture(); },
  reqtipo: el => { $('#folio-f').classList.toggle('hide', !isIncap(el.value)); },
  per: el => { S.per.preset = el.value; render(); },
  perfrom: el => { S.per.from = el.value; render(); },
  perto: el => { S.per.to = el.value; render(); },
  regw: el => { S.reg.w = el.value; render(); },
  regt: el => { S.reg.t = el.value; render(); },
  ajop: el => { const A = S.aj; openAdjust({ ...A, ...readAdj(), op: el.value, ref: '' }); },
  ajw: el => { openAdjust({ ...S.aj, ...readAdj(), w: el.value, ref: '' }); },
  import: el => {
    const file = el.files[0]; if (!file) return; const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || d.v !== 1 || !Array.isArray(d.chain) || !Array.isArray(d.workers)) throw new Error('Formato no reconocido'); const v = verifyChain(d.chain); if (!v.ok && !confirm('La cadena del respaldo NO es íntegra (bloque #' + v.at + '). ¿Importar de todos modos?')) return; DB = d; save(); render(); toast('Respaldo importado'); } catch (e) { toast('No se pudo importar: ' + e.message); } };
    rd.readAsText(file);
  }
};
function readAdj() { const o = {}; [['date', '#ajd'], ['time', '#ajt'], ['k', '#ajk']].forEach(([k, id]) => { const e = $(id); if (e && e.value) o[k] = e.value; }); return o; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const f = ACT[el.dataset.act]; if (!f) return;
  const isSubmit = e.target.closest('button[type="submit"], input[type="submit"]'); // no cancelar el envío de formularios dentro de modales
  if (!isSubmit && el.dataset.act !== 'ovl' && el.tagName !== 'INPUT') e.preventDefault();
  f(el, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORM[f.dataset.form](f, new FormData(f)); });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el); });

/* ---------- Arranque ---------- */
function init() {
  applyTheme();
  DB = loadDB();
  if (!DB) { DB = seedDemo(Date.now()); save(); }
  render();
  // PWA: habilita instalación y uso sin conexión del cascarón de la app (no de la cámara ni el GPS)
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) { } }
}
init();
</script>
</body>
